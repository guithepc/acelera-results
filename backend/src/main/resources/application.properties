# server
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:pctheone}
quarkus.datasource.password=${DB_PASS:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:aceleradev}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# cors
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174,http://192.168.1.125:5173,https://aceleradev.com.br,https://resultados.aceleradev.com.br
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-admin-token

# cache
quarkus.cache.caffeine."students-globe".expire-after-write=5M

# secrets
admin.token=${ADMIN_TOKEN:dev-token-local}

# nominatim
geocoding.user-agent=aceleradev-globe/1.0 (contact: guilhermepclol056@gmail.com)
